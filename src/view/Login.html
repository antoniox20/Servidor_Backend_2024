<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="./css/estilos2.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="left-box">
                <img src="./img/Logo.jpg" alt="Escudo" class="escudo-img">
                <p class="text-white text-center mt-3">¡Bienvenido de nuevo! Por favor, ingrese sus datos para continuar.</p>
            </div>
            <div class="right-box">
                <div class="header-text mb-4 text-center">
                    <i class="fas fa-book fa-3x mb-3 text-primary"></i>
                    <h2>Bienvenido</h2>
                    <p class="text-muted">Inicie sesión con su cuenta</p>
                </div>
                <form id="loginForm" onsubmit="return handleSubmit(event)">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control form-control-lg" id="identifier" placeholder="Usuario o Email" required>
                    </div>
                    <div class="input-group mb-3 position-relative">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control form-control-lg" id="credential" placeholder="Contraseña" required>
                        <span class="input-group-text position-absolute end-0" onclick="togglePassword()">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </span>
                    </div>
                    <div class="mb-3 text-end">
                        <a href="olvidar_contraseña.html" class="text-decoration-none">Olvidé mi contraseña</a>
                    </div>
                    <div class="input-group mb-3">
                        <button type="submit" class="btn btn-lg btn-primary w-100">Iniciar Sesión</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modals for success and error messages -->
    <div class="modal" tabindex="-1" id="successModal">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center">
            <i class="fas fa-check-circle fa-3x text-success"></i>
            <p class="mt-3">¡Inicio de sesión exitoso!</p>
          </div>
        </div>
      </div>
    </div>
    <div class="modal" tabindex="-1" id="errorModal">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center">
            <i class="fas fa-times-circle fa-3x text-danger"></i>
            <p class="mt-3">Credenciales incorrectas. Por favor, intente nuevamente.</p>
          </div>
        </div>
      </div>
    </div>

    <script>
        const socket = io('http://localhost:3000'); 

        async function handleSubmit(event) {
            event.preventDefault(); 
            const identifier = document.getElementById('identifier').value;
            const credential = document.getElementById('credential').value;

            try {
                const success = await window.electron.login(identifier, credential);
                
                if (success === 'admin') {
                    $('#successModal').modal('show');
                    setTimeout(() => {
                        $('#successModal').modal('hide');
                        window.location.href = 'index.html'; // Redirigir al dashboard del administrador
                    }, 2000);
                } else if (success === 'estudiante') {
                    // Hacer la solicitud al servidor de estudiantes
                    const response = await fetch('http://localhost:3000/loginEstudiante', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email: identifier, telefono: credential })
                    });
                    
                    const result = await response.json();

                    if (response.ok) {
                        // Guardar los datos del estudiante en localStorage
                        localStorage.setItem('estudiante_nombre', result.estudiante.nombre);
                        localStorage.setItem('estudiante_apellido', result.estudiante.apellido);
                        localStorage.setItem('estudiante_apellido2', result.estudiante.apellido2);
                        localStorage.setItem('estudiante_nivel', result.estudiante.nivel);

                        $('#successModal').modal('show');
                        setTimeout(() => {
                            $('#successModal').modal('hide');
                            window.location.href = 'Estudiante.html'; // Redirigir al dashboard del estudiante
                        }, 2000);
                    } else {
                        $('#errorModal').modal('show');
                        setTimeout(() => {
                            $('#errorModal').modal('hide');
                        }, 2000);
                    }
                } else {
                    $('#errorModal').modal('show');
                    setTimeout(() => {
                        $('#errorModal').modal('hide');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error durante el proceso de autenticación:', error);
                $('#errorModal').modal('show');
                setTimeout(() => {
                    $('#errorModal').modal('hide');
                }, 2000);
            }
        }

        function togglePassword() {
            const passwordField = document.getElementById('credential');
            const togglePasswordIcon = document.getElementById('togglePasswordIcon');
            const type = passwordField.type === 'password' ? 'text' : 'password';
            passwordField.type = type;
            togglePasswordIcon.classList.toggle('fa-eye-slash');
        }
    </script>
</body>
</html>
